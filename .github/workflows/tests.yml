name: CPU tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.2.6 pytest==8.4.2 ruff==0.12.12 build==1.3.0
      - run: python -m pip install -e . --no-build-isolation
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: critic-poc demo --out runs/ci-demo --epochs 2 --scenes 40
      - run: python -m build
